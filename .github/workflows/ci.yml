name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hackersdigest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hackersdigest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run smoke suite (waitlist API)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hackersdigest
        run: npm run smoke

      - name: Run smoke suite (auth)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hackersdigest
        run: npm run smoke-auth

      - name: Run smoke suite (admin)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hackersdigest
        run: npm run smoke-admin

      - name: Run smoke suite (encrypted feed)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hackersdigest
        run: npm run smoke-feed

      - name: Run smoke suite (account management)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hackersdigest
        run: npm run smoke-account
